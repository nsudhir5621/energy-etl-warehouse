# Standalone Metabase example; warehouse/reporting provisioning is separate.
version: "3.8"

services:
  metabase:
    image: metabase/metabase:v0.50.27
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mb_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mb_data:
